name: rogsheba_mobile
description: "Bangla voice-first AI health triage for Bangladesh — Flutter port of the RogSheba web app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.1
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.2
  flutter_tts: ^4.2.5
  geolocator: ^14.0.3
  go_router: ^17.5.0
  latlong2: ^0.10.1
  permission_handler: ^13.0.1
  shared_preferences: ^2.5.5
  shimmer: ^4.0.0
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700